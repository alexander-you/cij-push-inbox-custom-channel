# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: cij-push-inbox
metadata:
  template: cij-push-inbox-custom-channel
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ./src/PushInbox.Functions
    language: dotnet
    host: function
  web:
    project: ./src/web
    language: js
    host: staticwebapp
    dist: .
hooks:
  postprovision:
    shell: sh
    run: ./infra/hooks/postprovision.sh
